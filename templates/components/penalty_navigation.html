<div class="penalty-nav-card">
    <div class="penalty-nav-title">
        Penalty Module Navigation
    </div>

    <div class="penalty-nav-links">

            <a href="{{ url_for('penalty_transaction.student_penalty_records') }}" class="penalty-nav-link primary">
                My Penalty Records
            </a>
        {% else %}
            <a href="{{ url_for('penalty_transaction.view_outstanding_penalties') }}" class="penalty-nav-link primary">

            </a>

            <a href="{{ url_for('penalty_transaction.librarian_choose_penalty_to_waive') }}" class="penalty-nav-link">
